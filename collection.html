<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Collection</title>
    <link rel="stylesheet" href="collection.css">
</head>
<body>
    <header class="header">
      <div class="Title">
        <span class="Title-icon">📖</span>
        <span class="Title-name">Collection</span>
      </div>
    </header>

    <!-- Today's time by category -->
    <section class="stats-section">
      <p class="stats-title">Today's sessions</p>
      <div class="stats-list" id="stats-list"></div>
    </section>

    <!-- Earned rewards -->
    <div class="grid-container" id="grid-container"></div>
    <div class="show-more-row" id="show-more-row"></div>

    <div class="actions">
        <button class="btn btn-secondary" id="mainMenuButton">← Back</button>
    </div>

    <script src="collection.js"></script>
</body>
</html>
