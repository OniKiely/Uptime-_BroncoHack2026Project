<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Uptime!</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="popup">

    <!-- Header — click logo 3x to activate demo mode -->
    <header class="header">
      <div class="logo" id="logo">
        <span class="logo-icon" id="logo-icon">🧍</span>
        <span class="logo-name">Uptime!</span>
      </div>
      <span class="demo-badge hidden" id="demo-badge">DEMO MODE</span>
    </header>

    <!-- Session timer + cheeky copy -->
    <section class="timer-section">
      <p class="timer-label">Sitting for</p>
      <div class="timer-display" id="timer-display">0m</div>
      <p class="quip" id="quip">Checking in…</p>
    </section>

    <!-- Progress bar toward next break -->
    <section class="progress-section">
      <div class="progress-meta">
        <span class="progress-label">Next break</span>
        <span class="progress-eta" id="break-countdown">—</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="progress-fill" style="width:0%"></div>
      </div>
    </section>

    <!-- Today's stats -->
    <section class="stats-row">
      <div class="stat">
        <div class="stat-value" id="break-count">0</div>
        <div class="stat-label">breaks today</div>
      </div>
      <div class="stat-divider"></div>
      <div class="stat">
        <div class="stat-value" id="total-sitting">0m</div>
        <div class="stat-label">sat today</div>
      </div>
    </section>

    <!-- Streak -->
    <div class="streak-row" id="streak-row">
      <span>🔥</span>
      <span id="streak-text">Start your streak today!</span>
    </div>

    <!-- Action buttons -->
    <div class="actions">
      <button class="btn btn-secondary" id="snooze-btn">+15 min</button>
      <button class="btn btn-primary"   id="break-btn">Break now</button>
    </div>
    <div class="actions">
      <button class="btn btn-primary" id="collection-btn">Collection</button>
    </div>

  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
